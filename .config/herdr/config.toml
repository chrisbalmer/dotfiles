# herdr (https://herdr.dev). Only overrides; `herdr --default-config` prints
# every setting with its default. Linked to ~/.config/herdr/config.toml by
# setup.sh. herdr keeps its session state and logs next to this file, not in
# it.

# The first-run notification setup. Missing means show it, so without this
# every new workspace would.
onboarding = false

[update]
# Off: herdr's version is managed elsewhere. Coder workspaces pin it in the
# template, and a Mac updates it with brew.
version_check = false
